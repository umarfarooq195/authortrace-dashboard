<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuthorTrace</title>
<style>
:root{--bg:#eef2f0;--surface:#fff;--sunk:#f6f8f7;--ink:#15211d;--muted:#5a6863;--line:#d6dedb;--accent:#1d5c63;--accent-ink:#fff;--accent-soft:#dcebea;--typed:#1f7a52;--paste:#c2412d;--untracked:#6f7a76;--other:#a8690f;--ok:#1f7a52;--warn:#b7791f;--bad:#c2412d;--r:8px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--surface:#151f1c;--sunk:#111a17;--ink:#e5eeea;--muted:#93a29d;--line:#26332f;--accent:#63b7b5;--accent-ink:#08110f;--accent-soft:#1b3433;--typed:#4fbf8a;--paste:#f07a66;--untracked:#94a09c;--other:#e3b04b;--ok:#4fbf8a;--warn:#e3b04b;--bad:#f07a66;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;line-height:1.25}h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--accent)}button{font:inherit}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px;display:grid;gap:18px}
.auth{max-width:380px;margin:60px auto;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
label{font-weight:600;font-size:13px;display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.small{padding:4px 10px;font-size:13px}.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs{display:flex;gap:4px}.tabs button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-radius:6px;cursor:pointer}.tabs button.on{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.v-good{color:var(--ok);background:var(--accent-soft)}.v-mid{color:var(--warn);background:#f6e7cc}.v-bad{color:var(--bad);background:#f9e0db}.v-none{color:var(--muted);background:var(--sunk)}
.scorechip{font-family:ui-monospace,monospace;font-weight:700;min-width:34px;text-align:center;display:inline-block;padding:2px 6px;border-radius:4px;background:var(--sunk)}
.compbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);min-width:120px}.compbar span{height:100%}
.flag{display:grid;grid-template-columns:4px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.flag .stripe{border-radius:2px}.flag.high .stripe{background:var(--bad)}.flag.medium .stripe{background:var(--warn)}.flag.low .stripe{background:var(--untracked)}
.flagquote{white-space:pre-wrap;margin-top:6px;padding:8px 10px;border-left:3px solid var(--paste);background:var(--sunk);border-radius:4px;font-size:13px}
.err{color:var(--bad)}.ok{color:var(--ok)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:700;z-index:50;max-width:380px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.statrow>div{background:var(--surface);padding:10px;display:grid;gap:2px}.statrow b{font-family:ui-monospace,monospace;font-size:18px}.statrow span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.back{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}

/* ---------- premium polish ---------- */
body{background:
  radial-gradient(1200px 500px at 90% -10%, var(--accent-soft) 0%, transparent 60%),
  var(--bg);background-attachment:fixed}
.wrap{max-width:1120px}
.card{box-shadow:0 1px 2px rgba(10,30,25,.05),0 18px 40px -30px rgba(10,30,25,.35)}
.topbar h1{letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--accent),var(--typed));display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{transition:transform .04s ease,box-shadow .15s ease}.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 6px 16px -8px var(--accent)}

/* hero / score */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--typed))}
.ring{--p:0;--c:var(--accent);width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(closest-side,var(--surface) 78%,transparent 79% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring .n{font-family:ui-monospace,monospace;font-weight:800;font-size:34px;line-height:1;color:var(--c)}
.ring .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:3px}
.verdict-line{font-size:17px;font-weight:650;line-height:1.4;margin:2px 0 4px}
.reasons{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons .ic{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.reasons .good .ic{background:var(--accent-soft);color:var(--ok)}.reasons .bad .ic{background:#f9e0db;color:var(--bad)}.reasons .neutral .ic{background:var(--sunk);color:var(--muted)}
@media(prefers-color-scheme:dark){.reasons .bad .ic{background:#3a201b}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tile{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:3px}
.tile b{font-family:ui-monospace,monospace;font-size:20px;line-height:1.1;letter-spacing:-.01em}
.tile span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile small{font-size:11px;color:var(--muted)}

/* composition legend bar */
.compbar{height:16px;border-radius:8px}
.complegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px}
.complegend b{font-family:ui-monospace,monospace}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.d-typed{background:var(--typed)}.d-paste{background:var(--paste)}.d-ai{background:var(--other)}.d-untracked{background:var(--untracked)}

.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head .hint{font-size:12.5px;color:var(--muted);font-weight:400}

/* timeline */
.tlwrap{position:relative;height:96px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tl-sess{position:absolute;top:12px;height:20px;background:linear-gradient(180deg,var(--typed),color-mix(in srgb,var(--typed) 80%,#000));border-radius:5px;opacity:.9}
.tl-ai{position:absolute;top:40px;height:18px;background:var(--other);opacity:.28;border-radius:4px;border:1px solid var(--other)}
.tl-ai-lbl{position:absolute;top:40px;font-size:10px;color:var(--other);font-weight:700;padding-left:3px;white-space:nowrap;pointer-events:none}
.tl-row-lbl{position:absolute;left:8px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tl-paste{position:absolute;top:66px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface);cursor:default;z-index:3}
.tl-paste.red{background:var(--paste)}.tl-paste.orange{background:var(--other)}
.tl-shot{position:absolute;top:80px;width:11px;height:10px;border-radius:2px;background:var(--accent);transform:translateX(-50%);cursor:default;z-index:2;opacity:.85}
.tl-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}
.tl-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px}

/* correlations */
.corr{display:grid;gap:10px}
.corr-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--other);border-radius:9px;background:var(--sunk)}
.corr-item .ai{flex:none;font-weight:800;color:var(--other);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.corr-item .big{font-weight:650}
.corr-none{color:var(--muted);font-size:13.5px}

/* sessions */
.sess{display:grid;gap:8px}
.sess-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk)}
.sess-row .idx{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
.sess-row .meta{font-size:12.5px;color:var(--muted)}
.sess-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);min-width:90px;margin-top:5px;max-width:260px}

/* sparkline */
.spark{width:100%;height:120px;display:block}
.spark-tip{fill:var(--muted);font-size:10px}

/* document highlight view */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.sw-typed{background:var(--surface)}.sw-untracked{background:color-mix(in srgb,var(--untracked) 30%,var(--surface))}
.sw-paste{background:color-mix(in srgb,var(--paste) 26%,var(--surface))}.sw-ai{background:color-mix(in srgb,var(--other) 30%,var(--surface))}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:650;cursor:pointer}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.atv{position:relative;font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg{border-radius:3px;padding:1px 0;transition:opacity .12s ease}
.seg-untracked{background:color-mix(in srgb,var(--untracked) 26%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--untracked) 30%,transparent)}
.seg-paste{background:color-mix(in srgb,var(--paste) 24%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--paste) 32%,transparent)}
.seg-paste-ai{background:color-mix(in srgb,var(--other) 30%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--other) 40%,transparent);cursor:help}
.seg:hover{filter:brightness(1.06);outline:1px solid var(--accent)}
.atv[data-flt] .seg{opacity:.18}
.atv[data-flt="paste"] .seg-paste{opacity:1}
.atv[data-flt="paste-ai"] .seg-paste-ai{opacity:1}
.atv[data-flt="untracked"] .seg-untracked{opacity:1}

/* screenshots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk);display:grid;grid-template-rows:1fr auto}
.shot .ph{aspect-ratio:16/10;display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--sunk)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;aspect-ratio:16/10}
.shot .cap{font-size:11px;color:var(--muted);padding:6px 8px}
.lightbox{position:fixed;inset:0;background:rgba(5,12,10,.82);display:grid;place-items:center;z-index:80;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px -20px #000}

/* flags, restyled for readability */
.fl{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);border-left-width:4px}
.fl+.fl{margin-top:9px}
.fl-high{border-left-color:var(--bad)}.fl-med{border-left-color:var(--warn)}.fl-low{border-left-color:var(--untracked)}
.fl-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.fl-high .fl-ic,.fl-high .fl-badge{background:#f9e0db;color:var(--bad)}
.fl-med .fl-ic,.fl-med .fl-badge{background:#f6e7cc;color:var(--warn)}
.fl-low .fl-ic,.fl-low .fl-badge{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
@media(prefers-color-scheme:dark){.fl-high .fl-ic,.fl-high .fl-badge{background:#3a201b}.fl-med .fl-ic,.fl-med .fl-badge{background:#36301a}}
.fl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fl-badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px}
.fl-title{font-size:14.5px;line-height:1.35;font-weight:700}
.fl-detail{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.fl-quote{white-space:pre-wrap;margin-top:9px;padding:9px 11px;border-left:3px solid var(--line);background:var(--surface);border-radius:6px;font-size:12.5px;max-height:130px;overflow:auto}
.fl-qlabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:4px}
.fl-ok{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.fl[data-seg]{cursor:pointer}
.fl[data-seg]:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fl-jump{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;color:var(--accent)}
.seg-flash{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px;background:var(--accent-soft)!important;animation:segflash 1.1s ease}
@keyframes segflash{0%{background:var(--accent)}45%{background:var(--accent-soft)}100%{background:var(--accent-soft)}}
.sync{display:grid;gap:3px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.sync b{font-size:13.5px}
</style>
</head>

<script>
/* AuthorTrace analysis engine v1
 * Works in the browser (window.ATEngine) and in Node (module.exports).
 * Inputs:
 *   rev  = owner export  { format:"authortrace.revisions", docId, title, users:{id:name}, ops:[[t,u,"i",idx,text]|[t,u,"d",si,ei]], changelog? , competitors:[{url,title,text}] }
 *   evs  = writer evidence files (array) { format:"authortrace.evidence", docId, writer, keys:[[t,cat,trusted]], pastes:[{t,len,text,hash,source}], focus:[{t,ev}], heartbeats:[t], aiVisits:[{domain,start,end}], screenshots:[{t,assetId|dataUrl}], declaration, sessions, ext:[{t,ev}] }
 *   ctx  = { settings, baseline, styleVector }
 */
(function (root) {
  "use strict";
  var E = {};

  E.VERSION = "1.1.0";
  E.DEFAULT_SETTINGS = {
    weights: { origin: 30, behaviour: 20, integrity: 15, source: 15, baseline: 10, text: 10 },
    idleMs: 60000,
    sessionGapMs: 30 * 60000,
    matchWindowMs: 20000,
    largePasteChars: 200,
    impossibleWpm: 90,
    aiDomains: ["chatgpt.com", "chat.openai.com", "openai.com", "claude.ai", "gemini.google.com", "bard.google.com",
      "perplexity.ai", "copilot.microsoft.com", "poe.com", "quillbot.com", "undetectable.ai", "jasper.ai",
      "writesonic.com", "copy.ai", "rytr.me", "grok.com", "x.ai", "deepseek.com", "chat.deepseek.com",
      "meta.ai", "you.com", "character.ai", "humanizeai.pro", "stealthwriter.ai", "bypassgpt.ai", "writehuman.ai"]
  };

  var CHAR_CATS = { c: 1, p: 1, q: 1, s: 1, e: 1 };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function mean(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function sd(a) { if (a.length < 2) return 0; var m = mean(a), s = 0; for (var i = 0; i < a.length; i++) s += (a[i] - m) * (a[i] - m); return Math.sqrt(s / (a.length - 1)); }
  function median(a) { if (!a.length) return 0; var b = a.slice().sort(function (x, y) { return x - y; }); var m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }
  function round(v, d) { var p = Math.pow(10, d || 0); return Math.round(v * p) / p; }
  function wordsIn(s) { var m = s.match(/[A-Za-z0-9À-ɏ؀-ۿ']+/g); return m ? m.length : 0; }
  function cleanDocText(s) { return s.replace(/[\u0000-\u0008\u000B-\u001F\u007F]/g, "\n").replace(/\n{3,}/g, "\n\n"); }
  E.cleanDocText = cleanDocText;
  E.wordsIn = wordsIn;

  function domainMatches(domain, list) {
    if (!domain) return false;
    domain = String(domain).toLowerCase().replace(/^www\./, "");
    for (var i = 0; i < list.length; i++) {
      var d = list[i].toLowerCase();
      if (domain === d || domain.slice(-(d.length + 1)) === "." + d) return true;
    }
    return false;
  }
  E.domainMatches = domainMatches;

  /* ---------- 1. Revision parsing ---------- */
  function flattenCmd(cmd, out) {
    if (!cmd || typeof cmd !== "object") return;
    if (cmd.ty === "mlti" && Array.isArray(cmd.mts)) { for (var i = 0; i < cmd.mts.length; i++) flattenCmd(cmd.mts[i], out); }
    else if (cmd.ty === "is" && typeof cmd.s === "string") out.push(["i", cmd.ibi, cmd.s]);
    else if (cmd.ty === "ds" && typeof cmd.si === "number") out.push(["d", cmd.si, cmd.ei]);
  }
  E.flattenCmd = flattenCmd;

  /** Normalize either raw Google changelog or compact ops into [{t,u,type,idx,text,si,ei}] */
  E.normalizeOps = function (rev) {
    var out = [];
    if (rev && Array.isArray(rev.ops)) {
      for (var i = 0; i < rev.ops.length; i++) {
        var o = rev.ops[i];
        if (!Array.isArray(o)) continue;
        if (o[2] === "i") out.push({ t: +o[0], u: String(o[1]), type: "ins", idx: +o[3], text: String(o[4]) });
        else if (o[2] === "d") out.push({ t: +o[0], u: String(o[1]), type: "del", si: +o[3], ei: +o[4] });
      }
    } else if (rev && Array.isArray(rev.changelog)) {
      for (var j = 0; j < rev.changelog.length; j++) {
        var e = rev.changelog[j];
        if (!Array.isArray(e)) continue;
        var flat = []; flattenCmd(e[0], flat);

    var ev = a._ev || {}, ops = a._ops || [], comp = a.composition || {}, st = a.stats || {};
    var aiDomains = E.DEFAULT_SETTINGS.aiDomains;
    var offset = (st.offsetSec || 0) * 1000; // evidence clock - revision clock
    var hasRev = !!a.hasRevisions;
    function toLine(evT) { return hasRev ? evT - offset : evT; }   // evidence event -> revision timeline
    function toEv(revT) { return hasRev ? revT + offset : revT; }  // revision time -> evidence clock

    // ---- enriched, merged segments of the final document
    var raw = E.segments(a), segs = [];
    raw.forEach(function (s) {
      var kind = s.cls, domain = null;
      if (s.cls === "paste") {
        var op = ops[s.opi];
        var p = (op && op.paste !== undefined) ? ev.pastes[op.paste] : null;
        if (p && p.source && p.source.domain) domain = p.source.domain;
        var isAi = domain && domainMatches(domain, aiDomains);
        if (!isAi && op) {
          var opEv = op.t + offset;
          var v = (ev.aiVisits || []).filter(function (vv) { return domainMatches(vv.domain, aiDomains) && vv.end >= opEv - 900000 && vv.start <= opEv + 30000; });
          if (v.length) { isAi = true; domain = v[v.length - 1].domain; }
        }
        if (isAi) kind = "paste-ai";
      }
      var last = segs[segs.length - 1];
      if (last && last.kind === kind && last.domain === domain) last.text += s.text;
      else segs.push({ text: s.text, kind: kind, domain: domain, t: s.t });
    });

    // ---- pastes (evidence), ai-flagged, internal (doc-to-doc) dropped
    var pastes = (ev.pastes || []).map(function (p) {
      var domain = (p.source && p.source.domain) || null;
      return { t: p.t, tl: toLine(p.t), len: p.len || 0, words: wordsIn(p.text || ""),
        ai: !!(domain && domainMatches(domain, aiDomains)), internal: !!(p.source && p.source.internal), domain: domain,
        preview: String(p.text || "").replace(/\s+/g, " ").trim().slice(0, 160) };
    }).filter(function (p) { return !p.internal; });

    // ---- AI site visits (evidence)
    var aiVisits = (ev.aiVisits || []).filter(function (v) { return domainMatches(v.domain, aiDomains); })
      .map(function (v) { return { domain: v.domain, start: v.start, end: v.end, sl: toLine(v.start), el: toLine(v.end), min: Math.max(1, Math.round((v.end - v.start) / 60000)) }; });

    // ---- paste <-> AI visit correlations (the strongest signal)
    var correlations = [];
    pastes.forEach(function (p) {
      if ((p.len || 0) < 40) return;
      var near = aiVisits.filter(function (v) { return v.end >= p.t - 900000 && v.start <= p.t + 30000; });
      if (near.length) {
        var v = near[near.length - 1], gap = Math.round((p.t - v.end) / 1000);
        correlations.push({ domain: v.domain, visitMin: v.min, words: p.words, len: p.len, gapSec: gap < 0 ? 0 : gap, t: p.tl, direct: false });
      } else if (p.ai) {
        correlations.push({ domain: p.domain, visitMin: null, words: p.words, len: p.len, gapSec: null, t: p.tl, direct: true });
      }
    });
    correlations.sort(function (x, y) { return y.words - x.words; });

    // ---- screenshots (evidence)
    var shots = (ev.screenshots || []).map(function (sh) { return { t: sh.t, tl: toLine(sh.t), path: sh.path || null, dataUrl: sh.dataUrl || null }; });

    // ---- sessions (revision clock)
    var sessions = (a.sessions || []).map(function (s) {
      return { start: s.start, end: s.end, durMin: Math.max(0, Math.round((s.end - s.start) / 60000)), added: s.added || 0, removed: s.removed || 0, words: Math.round((s.added || 0) / 5.7) };
    });

    // ---- timeline bounds
    var lo = [], hi = [];
    if (hasRev && st.firstT) { lo.push(st.firstT); hi.push(st.lastT); }
    sessions.forEach(function (s) { lo.push(s.start); hi.push(s.end); });
    pastes.forEach(function (p) { lo.push(p.tl); hi.push(p.tl); });
    aiVisits.forEach(function (v) { lo.push(v.sl); hi.push(v.el); });
    shots.forEach(function (s) { lo.push(s.tl); hi.push(s.tl); });
    if (a.keyStats && a.keyStats.perMinute && a.keyStats.perMinute.length) { lo.push(toLine(a.keyStats.perMinute[0][0])); hi.push(toLine(a.keyStats.perMinute[a.keyStats.perMinute.length - 1][0])); }
    var start = lo.length ? Math.min.apply(null, lo) : 0;
    var end = hi.length ? Math.max.apply(null, hi) : start + 60000;
    if (end <= start) end = start + 60000;

    // ---- typing speed over time (words per minute per minute), on the revision timeline
    var speed = (a.keyStats && a.keyStats.perMinute || []).map(function (pm) { return { t: toLine(pm[0]), wpm: pm[1] }; })
      .filter(function (x) { return x.t >= start - 120000 && x.t <= end + 120000; });

    return {
      segments: segs, pastes: pastes, aiVisits: aiVisits, correlations: correlations,
      screenshots: shots, sessions: sessions, timeline: { start: start, end: end },
      speed: speed, humanWpm: E.DEFAULT_SETTINGS.impossibleWpm,
      composition: comp, stats: st, hasRev: hasRev, hasEv: !!a.hasEvidence,
      counts: {
        typedWords: segs.filter(function (s) { return s.kind === "typed"; }).reduce(function (n, s) { return n + wordsIn(s.text); }, 0),
        pasteWords: segs.filter(function (s) { return s.kind === "paste"; }).reduce(function (n, s) { return n + wordsIn(s.text); }, 0),
        aiPasteWords: segs.filter(function (s) { return s.kind === "paste-ai"; }).reduce(function (n, s) { return n + wordsIn(s.text); }, 0),
        untrackedWords: segs.filter(function (s) { return s.kind === "untracked"; }).reduce(function (n, s) { return n + wordsIn(s.text); }, 0)
      }
    };
  };

  /** Baseline from a typing test file */
  E.baselineFromTest = function (test) {
    var ks = E.keyStats(test.keys || []);
    return { wpm: ks.wpm, cv: ks.cv, editRatio: ks.editRatio, thinkingPer100: ks.thinkingPer100Words, meanInterval: ks.meanInterval, keys: ks.total, at: test.at || Date.now(), durationMs: test.durationMs || 0 };
  };

  if (typeof module !== "undefined" && module.exports) module.exports = E;
  else root.ATEngine = E;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
(function () {
  "use strict";
  var E = window.ATEngine;
  var sb = supabase.createClient(window.AT_CONFIG.url, window.AT_CONFIG.anonKey);
  var app = document.getElementById("app");
  var S = { user: null, org: null, role: null, members: [], docs: [], tab: "docs", view: { page: "list" }, busy: false };

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function toast(m,bad){var e=document.createElement("div");e.className="toast";e.style.background=bad?"var(--bad)":"var(--ink)";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},3800);}
  function docIdFromUrl(u){var m=String(u||"").match(/document\/(?:u\/\d+\/)?d\/([a-zA-Z0-9_-]{20,})/);return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(u.trim())?u.trim():null);}
  function scoreColor(s){return s>=70?"var(--ok)":s>=45?"var(--warn)":"var(--bad)";}
  function vClass(v){return v==="Likely human"?"v-good":v==="Needs review"?"v-mid":v?"v-bad":"v-none";}
  function fmtMin(m){m=Math.round(m||0);return m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min";}
  function relTime(iso){if(!iso)return "not yet";var t=new Date(iso).getTime(),s=Math.round((Date.now()-t)/1000);if(s<60)return s+" sec ago";var m=Math.round(s/60);if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<24)return h+" h ago";return new Date(t).toLocaleString();}
  function syncBanner(hist,any){return '<div class="sync"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><b>Document text last pulled from Google Docs '+relTime(hist)+'</b><div class="small muted" style="margin-top:3px">Writing activity '+relTime(any)+'</div></div><button class="btn small primary" id="refetch">Fetch fresh data</button></div><div class="small muted">The writer\'s extension pulls the doc while it is open and when they switch away from it. This button re-reads the latest data the extension has sent. To get the newest edits, the writer should switch to another tab for a few seconds, then click this.</div></div>';}

  /* ---------- boot ---------- */
  sb.auth.getSession().then(function(r){ S.user = r.data.session && r.data.session.user; S.user ? loadWorkspace() : renderAuth(); });
  sb.auth.onAuthStateChange(function(_e, session){ var u = session && session.user; if ((u&&u.id)!==(S.user&&S.user.id)){ S.user=u; u?loadWorkspace():renderAuth(); } });

  /* ---------- auth ---------- */
  function renderAuth(err){
    app.innerHTML =
      '<div class="auth"><h1>AuthorTrace</h1><p class="muted">Sign in to your agency workspace.</p>'+
      '<div class="card"><label>Email<input type="email" id="email" autocomplete="email"></label>'+
      '<label>Password<input type="password" id="password" autocomplete="current-password"></label>'+
      (err?'<p class="err small">'+esc(err)+'</p>':'')+
      '<div class="row"><button class="btn primary" id="signin">Sign in</button><button class="btn" id="signup">Create account</button></div>'+
      '<p class="small muted">New here? Enter an email and password, then click Create account.</p></div></div>';
    document.getElementById("signin").onclick=function(){auth("in");};
    document.getElementById("signup").onclick=function(){auth("up");};
    app.querySelectorAll("input").forEach(function(i){i.addEventListener("keydown",function(e){if(e.key==="Enter")auth("in");});});
  }
  function auth(mode){
    var email=document.getElementById("email").value.trim(), pw=document.getElementById("password").value;
    if(!email||!pw)return renderAuth("Enter an email and password.");
    var p = mode==="up" ? sb.auth.signUp({email:email,password:pw}) : sb.auth.signInWithPassword({email:email,password:pw});
    p.then(function(r){
      if(r.error)return renderAuth(r.error.message);
      if(mode==="up" && !r.data.session) return renderAuth("Account made. Check your email to confirm, or turn off 'Confirm email' in Supabase, then sign in.");
      // onAuthStateChange will load workspace
    });
  }

  /* ---------- workspace ---------- */
  function loadWorkspace(){
    app.innerHTML='<div class="wrap"><p class="muted">Loading your workspace...</p></div>';
    sb.from("orgs").select("*").then(function(r){
      if(r.error)return fail(r.error);
      var owned=(r.data||[]).filter(function(o){return o.owner_id===S.user.id;});
      if(owned.length){ S.org=owned[0]; S.role="owner"; return afterOrg(); }
      if((r.data||[]).length){ S.org=r.data[0]; return loadRole().then(afterOrg); }
      renderCreateOrg();
    });
  }
  function loadRole(){ return sb.from("members").select("role").eq("org_id",S.org.id).eq("user_id",S.user.id).maybeSingle().then(function(r){ S.role=(r.data&&r.data.role)||"reviewer"; }); }
  function fail(e){ app.innerHTML='<div class="wrap"><div class="card"><h2>Something went wrong</h2><p class="err">'+esc(e.message||e)+'</p><button class="btn" onclick="location.reload()">Reload</button></div></div>'; }

  function renderCreateOrg(){
    app.innerHTML='<div class="auth"><h1>Create your agency</h1><p class="muted">This is your private workspace. Writers and docs live here.</p>'+
      '<div class="card"><label>Agency name<input type="text" id="orgname" value="Rank Fest"></label>'+
      '<div class="row"><button class="btn primary" id="create">Create agency</button><button class="btn ghost" id="out">Sign out</button></div></div></div>';
    document.getElementById("out").onclick=signOut;
    document.getElementById("create").onclick=function(){
      var name=document.getElementById("orgname").value.trim()||"My Agency";
      sb.from("orgs").insert({name:name,owner_id:S.user.id}).select().single().then(function(r){
        if(r.error)return toast(r.error.message,true);
        S.org=r.data; S.role="owner";
        sb.from("members").insert({org_id:S.org.id,user_id:S.user.id,email:S.user.email,role:"owner",name:"Owner"}).then(function(){ afterOrg(); });
      });
    };
  }
  function afterOrg(){
    return Promise.all([
      sb.from("members").select("*").eq("org_id",S.org.id),
      sb.from("documents").select("*").eq("org_id",S.org.id).order("created_at",{ascending:false})
    ]).then(function(res){
      S.members=res[0].data||[]; S.docs=res[1].data||[];
      // link my membership if missing
      var mine=S.members.filter(function(m){return m.user_id===S.user.id;})[0];
      if(!mine){ sb.from("members").update({user_id:S.user.id}).eq("org_id",S.org.id).eq("email",S.user.email).then(function(){}); }
      render();
    });
  }
  function signOut(){ sb.auth.signOut().then(function(){ S.org=null; S.user=null; renderAuth(); }); }
  function writers(){ return S.members.filter(function(m){return m.role==="writer";}); }

  /* ---------- render shell ---------- */
  function render(){
    if(S.view.page==="doc") return renderDoc(S.view.id);
    var tabs=[["docs","Docs"],["writers","Writers"],["settings","Settings"]];
    app.innerHTML='<div class="wrap">'+
      '<div class="topbar"><div class="brand grow"><span class="mark"></span><h1>AuthorTrace</h1></div><span class="small muted">'+esc(S.org.name)+' · '+esc(S.user.email)+'</span><button class="btn small ghost" id="out">Sign out</button></div>'+
      '<div class="tabs">'+tabs.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>'+
      '<div id="body"></div></div>';
    document.getElementById("out").onclick=signOut;
    app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;render();};});
    var body=document.getElementById("body");
    if(S.tab==="docs")body.innerHTML=docsPage(),wireDocs();
    else if(S.tab==="writers")body.innerHTML=writersPage(),wireWriters();
    else body.innerHTML=settingsPage(),wireSettings();
  }

  /* ---------- docs ---------- */
  function docsPage(){
    var opts=writers().map(function(w){return '<option value="'+esc(w.email)+'">'+esc(w.name||w.email)+'</option>';}).join("");
    var form='<div class="card"><h2>Assign a new doc</h2>'+
      (writers().length?'':'<p class="small err">Add a writer first in the Writers tab.</p>')+
      '<label>Google Doc link<input type="text" id="d-url" placeholder="https://docs.google.com/document/d/..."></label>'+
      '<label>Article title<input type="text" id="d-title" placeholder="e.g. Best running shoes 2026"></label>'+
      '<label>Writer<select id="d-writer">'+opts+'</select></label>'+
      '<label>Competitor links (optional, one per line)<textarea id="d-comp" placeholder="https://competitor.com/article"></textarea></label>'+
      '<div class="row"><button class="btn primary" id="d-add"'+(writers().length?"":" disabled")+'>Assign doc</button><span class="small muted" id="d-msg"></span></div></div>';
    var rows=S.docs.length?S.docs.map(function(d){
      var r=d._report;
      return '<tr class="clk" data-doc="'+d.id+'"><td><b>'+esc(d.title||"Untitled")+'</b><br><span class="small muted">'+esc(d.writer_email)+'</span></td>'+
        '<td>'+(r?'<span class="scorechip" style="color:'+scoreColor(r.score)+'">'+r.score+'</span>':'<span class="muted">-</span>')+'</td>'+
        '<td>'+(r?'<span class="pill '+vClass(r.verdict)+'">'+esc(r.verdict)+'</span>':'<span class="pill v-none">Not checked</span>')+'</td>'+
        '<td class="small muted">'+esc(d.status||"review")+'</td></tr>';
    }).join(""):'<tr><td colspan="4" class="muted">No docs yet.</td></tr>';
    return form+'<div class="card"><h2>Docs</h2><table><thead><tr><th>Doc</th><th>Score</th><th>Verdict</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function wireDocs(){
    var add=document.getElementById("d-add");
    if(add)add.onclick=function(){
      var url=document.getElementById("d-url").value.trim(), gid=docIdFromUrl(url);
      if(!gid)return document.getElementById("d-msg").innerHTML='<span class="err">Not a valid Google Doc link.</span>';
      var comps=document.getElementById("d-comp").value.split(/\s+/).filter(function(u){return /^https?:\/\//.test(u);}).map(function(u){return {url:u};});
      var row={org_id:S.org.id,google_doc_id:gid,title:document.getElementById("d-title").value.trim(),writer_email:document.getElementById("d-writer").value,competitors:comps,created_by:S.user.id,status:"review"};
      add.disabled=true;
      sb.from("documents").insert(row).select().single().then(function(r){
        add.disabled=false;
        if(r.error)return document.getElementById("d-msg").innerHTML='<span class="err">'+esc(r.error.message)+'</span>';
        S.docs.unshift(r.data); toast("Doc assigned"); render();
      });
    };
    app.querySelectorAll(".clk").forEach(function(tr){tr.style.cursor="pointer";tr.onclick=function(){S.view={page:"doc",id:tr.dataset.doc};render();};});
  }

  /* ---------- writers ---------- */
  function writersPage(){
    var rows=writers().length?writers().map(function(w){
      return '<tr><td><b>'+esc(w.name||"")+'</b></td><td>'+esc(w.email)+'</td><td class="small">'+(w.user_id?'<span class="ok">Signed in</span>':'<span class="muted">Not joined yet</span>')+'</td><td class="mono">'+(w.baseline?w.baseline.wpm+" wpm":"-")+'</td><td><button class="btn small ghost" data-del="'+w.id+'">Remove</button></td></tr>';
    }).join(""):'<tr><td colspan="5" class="muted">No writers yet.</td></tr>';
    return '<div class="card"><h2>Add a writer</h2><p class="small muted">Use the exact Gmail you will share docs with. The writer installs the extension and signs in with the same email.</p>'+
      '<div class="row"><input type="text" id="w-name" placeholder="Name" style="max-width:200px"><input type="email" id="w-email" placeholder="writer@gmail.com" class="grow"><button class="btn primary" id="w-add">Add</button></div><span class="small muted" id="w-msg"></span></div>'+
      '<div class="card"><h2>Writers</h2><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Baseline</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function wireWriters(){
    document.getElementById("w-add").onclick=function(){
      var email=document.getElementById("w-email").value.trim().toLowerCase(), name=document.getElementById("w-name").value.trim();
      if(!/.+@.+\..+/.test(email))return document.getElementById("w-msg").innerHTML='<span class="err">Enter a valid email.</span>';
      sb.from("members").insert({org_id:S.org.id,email:email,name:name,role:"writer"}).select().single().then(function(r){
        if(r.error)return document.getElementById("w-msg").innerHTML='<span class="err">'+esc(r.error.message.indexOf("duplicate")>=0?"That writer is already added.":r.error.message)+'</span>';
        S.members.push(r.data); toast("Writer added"); render();
      });
    };
    app.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){
      sb.from("members").delete().eq("id",b.dataset.del).then(function(r){ if(r.error)return toast(r.error.message,true); S.members=S.members.filter(function(m){return m.id!==b.dataset.del;}); toast("Writer removed"); render(); });
    };});
  }

  /* ---------- settings ---------- */
  function settingsPage(){
    return '<div class="card"><h2>Your agency</h2><div class="statrow"><div><span>Name</span><b style="font-size:15px">'+esc(S.org.name)+'</b></div><div><span>Your role</span><b style="font-size:15px">'+esc(S.role)+'</b></div><div><span>Writers</span><b>'+writers().length+'</b></div><div><span>Docs</span><b>'+S.docs.length+'</b></div></div>'+
      '<p class="small muted">Share the extension with your writers. They sign in with the Gmail you added. Tracking on assigned docs starts after they agree once.</p></div>';
  }
  function wireSettings(){}

  /* ---------- doc report ---------- */
  function renderDoc(id){
    var d=S.docs.filter(function(x){return x.id===id;})[0];
    if(!d){S.view={page:"list"};return render();}
    app.innerHTML='<div class="wrap"><span class="back" id="back">&larr; All docs</span><h1 style="margin-top:6px">'+esc(d.title||"Untitled")+'</h1><p class="muted small">'+esc(d.writer_email)+'</p><div id="rep"><p class="muted">Loading the writing data...</p></div></div>';
    document.getElementById("back").onclick=function(){S.view={page:"list"};render();};
    sb.from("events").select("*").eq("doc_id",id).order("created_at",{ascending:true}).then(function(r){
      if(r.error)return document.getElementById("rep").innerHTML='<p class="err">'+esc(r.error.message)+'</p>';
      buildReport(d,r.data||[]);
    });
  }
  function buildReport(d,events){
    var ev={format:"authortrace.evidence",keys:[],pastes:[],copies:[],focus:[],heartbeats:[],aiVisits:[],screenshots:[],declaration:null,consent:null};
    var rev=null;
    events.forEach(function(e){
      var p=e.payload||{};
      if(e.kind==="batch"){
        if(p.keys)ev.keys=ev.keys.concat(p.keys);
        if(p.pastes)ev.pastes=ev.pastes.concat(p.pastes);
        if(p.copies)ev.copies=ev.copies.concat(p.copies);
        if(p.focus)ev.focus=ev.focus.concat(p.focus);
        if(p.hb)ev.heartbeats=ev.heartbeats.concat(p.hb);
        if(p.aiVisits)ev.aiVisits=ev.aiVisits.concat(p.aiVisits);
        if(p.shots)ev.screenshots=ev.screenshots.concat(p.shots);
      } else if(e.kind==="history"){
        rev={format:"authortrace.revisions",ops:p.ops||[],users:p.users||{},revisions:p.revisions,competitors:p.competitors||(d.competitors||[]),title:d.title,docId:d.google_doc_id};
      } else if(e.kind==="done"){
        if(p.declaration)ev.declaration=p.declaration; if(p.consent)ev.consent=p.consent;
      }
    });
    if(!rev && (d.competitors||[]).length) rev={format:"authortrace.revisions",ops:[],users:{},competitors:d.competitors,title:d.title,docId:d.google_doc_id};
    var writer=S.members.filter(function(m){return (m.email||"").toLowerCase()===(d.writer_email||"").toLowerCase();})[0];
    if(!ev.keys.length && !ev.pastes.length && !(rev&&rev.ops.length)){
      document.getElementById("rep").innerHTML='<div class="empty"><h3>No writing data yet</h3><p>Once the writer opens this doc with the extension, the data appears here.</p></div>';
      return;
    }
    var a=E.analyze(rev,[ev],{baseline:writer&&writer.baseline});
    // save report (best effort)
    sb.from("reports").upsert({doc_id:d.id,org_id:S.org.id,score:a.score,verdict:a.verdict,summary:{score:a.score,verdict:a.verdict,composition:a.composition}}).then(function(){});
    d._report={score:a.score,verdict:a.verdict};
    var model=E.reportModel(a);
    var lastHist=null,lastAny=null;
    events.forEach(function(e){lastAny=e.created_at;if(e.kind==="history")lastHist=e.created_at;});
    document.getElementById("rep").innerHTML=syncBanner(lastHist,lastAny)+reportHtml(a,d,model);
    wireReport(a,d,model);
  }
  /* ---- report helpers ---- */
  function r1(n){return Math.round((n||0)*10)/10;}
  function clampN(v,a,b){return Math.max(a,Math.min(b,v));}
  function fmtClock(ms){if(!ms)return "—";var d=new Date(ms);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
  function fmtT(ms){if(!ms)return "—";return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
  function fmtD(min){min=Math.round(min||0);if(min<60)return min+" min";return Math.floor(min/60)+" h "+(min%60)+" min";}
  function pos(m,t){var s=m.timeline.start,e=m.timeline.end;return e>s?clampN((t-s)/(e-s)*100,0,100):0;}
  function findSeg(m,snippet){
    if(!snippet)return -1;
    var needle=String(snippet).toLowerCase().replace(/\s+/g," ").trim().slice(0,30);
    if(needle.length<8)return -1;
    for(var i=0;i<m.segments.length;i++){ if(m.segments[i].text.toLowerCase().replace(/\s+/g," ").indexOf(needle)>=0)return i; }
    return -1;
  }
  function jumpToSeg(id){
    var el=document.getElementById(id),atv=document.getElementById("atv");if(!el||!atv)return;
    var card=atv.closest(".card");if(card)card.scrollIntoView({behavior:"smooth",block:"start"});
    setTimeout(function(){atv.scrollTo({top:Math.max(0,el.offsetTop-atv.clientHeight/2+el.offsetHeight/2),behavior:"smooth"});el.classList.add("seg-flash");setTimeout(function(){el.classList.remove("seg-flash");},2400);},380);
  }

  function verdictSentence(a,m){
    var cc=m.counts,tot=cc.typedWords+cc.pasteWords+cc.aiPasteWords+cc.untrackedWords;
    if(!tot)return "This document is "+a.composition.typed+"% typed and confirmed.";
    function wp(x){return Math.round(x/tot*100);}
    var bits=[wp(cc.typedWords)+"% typed and confirmed"];
    if(cc.aiPasteWords)bits.push(wp(cc.aiPasteWords)+"% from an AI source");
    if(cc.pasteWords)bits.push(wp(cc.pasteWords)+"% pasted");
    if(cc.untrackedWords)bits.push(wp(cc.untrackedWords)+"% untracked");
    var sent="This document is "+bits.join(", ")+".";
    if(!cc.aiPasteWords&&m.correlations.length)sent+=" "+m.correlations.length+" paste"+(m.correlations.length>1?"s":"")+" lined up with an AI site visit.";
    return sent;
  }

  function timelineHtml(m){
    if(m.timeline.end<=m.timeline.start)return '<div class="tlwrap"><div class="tl-empty">Not enough timing data yet.</div></div>';
    var h="";
    m.sessions.forEach(function(s){var l=pos(m,s.start),w=Math.max(0.6,pos(m,s.end)-l);h+='<div class="tl-sess" style="left:'+l+'%;width:'+w+'%" title="Writing · '+fmtClock(s.start)+' · '+fmtD(s.durMin)+' · '+s.words+' words added"></div>';});
    m.aiVisits.forEach(function(v){var l=pos(m,v.sl),w=Math.max(0.8,pos(m,v.el)-l);h+='<div class="tl-ai" style="left:'+l+'%;width:'+w+'%" title="On '+esc(v.domain)+' · '+fmtClock(v.start)+' · '+v.min+' min"></div>';if(w>7)h+='<div class="tl-ai-lbl" style="left:'+l+'%">'+esc(v.domain)+'</div>';});
    m.pastes.forEach(function(p){var l=pos(m,p.tl);h+='<div class="tl-paste '+(p.ai?"orange":"red")+'" style="left:'+l+'%" title="'+(p.ai?"AI paste":"Paste")+' · '+p.words+' words'+(p.domain?" · "+esc(p.domain):"")+' · '+fmtClock(p.t)+'"></div>';});
    m.screenshots.forEach(function(s){var l=pos(m,s.tl);h+='<div class="tl-shot" style="left:'+l+'%" title="Screenshot · '+fmtClock(s.t)+'"></div>';});
    return '<div class="tlwrap">'+h+'</div><div class="tl-axis"><span>'+fmtClock(m.timeline.start)+'</span><span>'+fmtClock(m.timeline.end)+'</span></div>'+
      '<p class="small muted" style="margin:8px 0 0"><span class="dot d-typed"></span>Typing &nbsp; <span class="dot d-ai" style="opacity:.5"></span>AI site open &nbsp; <span class="dot d-paste"></span>Paste &nbsp; <span class="dot d-ai"></span>AI paste &nbsp; <span class="dot" style="background:var(--accent)"></span>Screenshot</p>';
  }

  function correlationsHtml(m){
    if(!m.correlations.length)return '<p class="corr-none">No pastes lined up with an AI site visit. That is a good sign.</p>';
    return '<div class="corr">'+m.correlations.slice(0,12).map(function(c){
      var line=c.direct?('Pasted '+c.words+' words copied straight from '+esc(c.domain)):('Visited '+esc(c.domain)+' for '+c.visitMin+' min, then pasted '+c.words+' words'+(c.gapSec!=null?' about '+(c.gapSec<60?c.gapSec+' sec':Math.round(c.gapSec/60)+' min')+' later':''));
      return '<div class="corr-item"><span class="ai">AI</span><div><div class="big">'+line+'</div><div class="small muted">'+fmtClock(c.t)+'</div></div></div>';
    }).join("")+'</div>';
  }

  function sessionsHtml(m){
    if(!m.sessions.length)return '<p class="muted small">No separate writing sessions detected yet.</p>';
    return '<div class="sess">'+m.sessions.slice(0,14).map(function(s,i){
      return '<div class="sess-row"><div class="idx">'+(i+1)+'</div><div><b>'+fmtClock(s.start)+'</b><div class="meta">'+fmtD(s.durMin)+' · '+s.words+' words added'+(s.removed?' · '+Math.round(s.removed/5.7)+' removed':'')+'</div></div><div class="small muted">ends '+fmtT(s.end)+'</div></div>';
    }).join("")+'</div>';
  }

  function sparkHtml(m){
    var pts=m.speed;if(pts.length<2)return '';
    var w=600,h=120,pad=26;
    var maxW=Math.max(m.humanWpm+20,40);pts.forEach(function(p){if(p.wpm*1.1>maxW)maxW=p.wpm*1.1;});
    var X=function(t){return pad+(t-m.timeline.start)/(m.timeline.end-m.timeline.start)*(w-pad*2);};
    var Y=function(v){return h-18-(v/maxW)*(h-30);};
    var poly=pts.map(function(p){return r1(X(p.t))+","+r1(Y(p.wpm));}).join(" ");
    var hy=r1(Y(m.humanWpm));
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<line x1="'+pad+'" y1="'+hy+'" x2="'+(w-pad)+'" y2="'+hy+'" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="5 4"/>'+
      '<text class="spark-tip" x="'+(w-pad)+'" y="'+(hy-4)+'" text-anchor="end">human limit ~'+m.humanWpm+' wpm</text>'+
      '<polyline points="'+poly+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '</svg><div class="tl-axis"><span>'+fmtClock(m.timeline.start)+'</span><span>'+fmtClock(m.timeline.end)+'</span></div>';
  }

  function documentHtml(m){
    var body=m.segments.map(function(s,i){
      var t=esc(s.text).replace(/\n/g,"<br>");
      if(s.kind==="typed")return '<span class="seg seg-typed" id="seg'+i+'">'+t+'</span>';
      var title=s.kind==="untracked"?"Untracked — no keystroke proof for this text":s.kind==="paste-ai"?("Pasted from AI"+(s.domain?" ("+s.domain+")":"")):s.kind==="paste"?"Pasted — source unknown":"Added by another account";
      var k=s.kind==="other"?"untracked":s.kind;
      return '<span class="seg seg-'+k+'" id="seg'+i+'" title="'+esc(title)+'">'+t+'</span>';
    }).join("");
    return '<div class="legend">'+
      '<span class="lg"><i class="sw sw-typed"></i>Typed &amp; confirmed</span>'+
      '<span class="lg"><i class="sw sw-untracked"></i>Untracked</span>'+
      '<span class="lg"><i class="sw sw-paste"></i>Pasted</span>'+
      '<span class="lg"><i class="sw sw-ai"></i>Pasted from AI</span></div>'+
      '<div class="filters"><button class="fbtn on" data-f="all">All</button><button class="fbtn" data-f="paste">Pastes</button><button class="fbtn" data-f="paste-ai">AI pastes</button><button class="fbtn" data-f="untracked">Untracked</button></div>'+
      '<div class="atv" id="atv">'+body+'</div>'+
      '<p class="small muted" style="margin:2px 0 0">Hover any highlighted part to see what it is and where it came from.</p>';
  }

  function screenshotsHtml(m){
    return '<div class="shots">'+m.screenshots.map(function(s){
      return '<div class="shot"><div class="ph" data-path="'+esc(s.path||"")+'"'+(s.dataUrl?' data-url="'+esc(s.dataUrl)+'"':'')+'>loading…</div><div class="cap">'+fmtClock(s.t)+'</div></div>';
    }).join("")+'</div>';
  }

  function reportHtml(a,d,m){
    var c=a.composition,st=a.stats,cc=m.counts;
    var tot=cc.typedWords+cc.pasteWords+cc.aiPasteWords+cc.untrackedWords||1;
    function wp(x){return r1(x/tot*100);}
    var col=scoreColor(a.score);
    var reasons=(a.reasons||[]).slice(0,6).map(function(rr){
      var cls=rr.good===true?"good":rr.good===null?"neutral":"bad",ic=rr.good===true?"+":rr.good===null?"i":"!";
      return '<li class="'+cls+'"><span class="ic">'+ic+'</span><span>'+esc(rr.text)+'</span></li>';
    }).join("");
    var hero='<div class="card hero">'+
      '<div class="ring" style="--p:'+a.score+';--c:'+col+'"><div style="text-align:center"><div class="n">'+a.score+'</div><div class="l">Human score</div></div></div>'+
      '<div><div class="row" style="gap:8px"><span class="pill '+vClass(a.verdict)+'" style="font-size:14px">'+esc(a.verdict)+'</span><span class="small muted">'+esc(a.confidence)+' confidence</span></div>'+
      '<p class="verdict-line">'+esc(verdictSentence(a,m))+'</p><ul class="reasons">'+reasons+'</ul></div></div>';

    var aiPasteN=m.pastes.filter(function(p){return p.ai;}).length;
    var tiles='<div class="tiles">'+
      '<div class="tile"><b>'+st.words+'</b><span>Words</span></div>'+
      '<div class="tile"><b>'+fmtD(st.activeMin)+'</b><span>Active time</span></div>'+
      '<div class="tile"><b>'+st.wpm+'</b><span>Typing speed</span><small>wpm</small></div>'+
      '<div class="tile"><b>'+st.peakWpm+'</b><span>Peak speed</span><small>limit '+m.humanWpm+'</small></div>'+
      '<div class="tile"><b>'+st.pastes+'</b><span>Pastes</span></div>'+
      '<div class="tile"><b>'+aiPasteN+'</b><span>From AI</span>'+(cc.aiPasteWords?'<small>'+cc.aiPasteWords+' words</small>':'')+'</div>'+
      '<div class="tile"><b>'+st.screenshots+'</b><span>Screenshots</span></div>'+
      '<div class="tile"><b>'+(st.sessions||m.sessions.length)+'</b><span>Sessions</span></div></div>';
    var comp='<div class="card"><div class="sec-head"><h2>How it was written</h2><span class="hint">green typed, grey untracked, red pasted, orange from AI</span></div>'+
      '<div class="compbar"><span style="width:'+wp(cc.typedWords)+'%;background:var(--typed)"></span><span style="width:'+wp(cc.pasteWords)+'%;background:var(--paste)"></span><span style="width:'+wp(cc.aiPasteWords)+'%;background:var(--other)"></span><span style="width:'+wp(cc.untrackedWords)+'%;background:var(--untracked)"></span></div>'+
      '<div class="complegend"><span><span class="dot d-typed"></span>Typed <b>'+wp(cc.typedWords)+'%</b></span><span><span class="dot d-paste"></span>Pasted <b>'+wp(cc.pasteWords)+'%</b></span><span><span class="dot d-ai"></span>From AI <b>'+wp(cc.aiPasteWords)+'%</b></span><span><span class="dot d-untracked"></span>Untracked <b>'+wp(cc.untrackedWords)+'%</b></span></div>'+
      tiles+'</div>';

    var timeline='<div class="card"><div class="sec-head"><h2>Writing timeline</h2><span class="hint">the whole story, start to finish</span></div>'+timelineHtml(m)+'</div>';
    var corr='<div class="card"><div class="sec-head"><h2>AI site and paste links</h2><span class="hint">pastes that followed time on an AI site</span></div>'+correlationsHtml(m)+'</div>';
    var speed=m.speed.length>=2?'<div class="card"><div class="sec-head"><h2>Typing speed over time</h2><span class="hint">spikes above the line are usually pastes</span></div>'+sparkHtml(m)+'</div>':'';
    var sessions='<div class="card"><div class="sec-head"><h2>Writing sessions</h2><span class="hint">natural sittings, split by long gaps</span></div>'+sessionsHtml(m)+'</div>';
    var docCard=m.segments.length?'<div class="card"><div class="sec-head"><h2>The document</h2><span class="hint">color shows how each part was produced</span></div>'+documentHtml(m)+'</div>':'';
    var shotsCard=m.screenshots.length?'<div class="card"><div class="sec-head"><h2>Screenshots</h2><span class="hint">random captures while writing</span></div>'+screenshotsHtml(m)+'</div>':'';

    var SEVLBL={high:["High","fl-high","!"],medium:["Medium","fl-med","!"],low:["Minor","fl-low","i"]};
    var flags=(a.flags||[]).slice().sort(function(x,y){var o={high:0,medium:1,low:2};return o[x.severity]-o[y.severity];}).map(function(f){
      var sv=SEVLBL[f.severity]||SEVLBL.low;
      var si=findSeg(m,f.snippet);
      var jump=si>=0?' data-seg="seg'+si+'"':'';
      var cue=si>=0?'<span class="fl-jump">Show in document &darr;</span>':'';
      return '<div class="fl '+sv[1]+'"'+jump+'><div class="fl-ic">'+sv[2]+'</div><div class="fl-body"><div class="fl-top"><span class="fl-badge">'+sv[0]+'</span><b class="fl-title">'+esc(f.title)+'</b></div>'+(f.detail?'<div class="fl-detail">'+esc(f.detail)+'</div>':'')+(f.snippet?'<div class="fl-quote"><span class="fl-qlabel">The exact text</span>'+esc(f.snippet)+'</div>':'')+cue+'</div></div>';
    }).join("")||'<div class="fl-ok">Nothing stood out in how this document was written.</div>';
    var comps=(a.competitors||[]).map(function(cp){
      var rows=(cp.matches||[]).map(function(mm){return '<tr><td class="small">'+esc(mm.doc)+'</td><td class="small muted">'+esc(mm.comp)+'</td><td class="mono">'+mm.sim+'%</td></tr>';}).join("");
      return '<h3 style="margin-top:10px"><a href="'+esc(cp.url)+'" target="_blank" rel="noopener">'+esc(cp.title||cp.url)+'</a> '+(cp.error?'<span class="err small">'+esc(cp.error)+'</span>':'<span class="small muted">'+cp.containment+'% overall</span>')+'</h3>'+(rows?'<table><thead><tr><th>This doc</th><th>Competitor</th><th>Match</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="small muted">No close sentence matches.</p>');
    }).join("")||'<p class="small muted">No competitors set.</p>';

    var flagCount=(a.flags||[]).length;
    var flagsCard='<div class="card"><div class="sec-head"><h2>Flags</h2>'+(flagCount?'<span class="hint">'+flagCount+' thing'+(flagCount>1?"s":"")+' worth a look</span>':'<span class="hint">nothing stood out</span>')+'</div>'+flags+'</div>';
    return hero+comp+flagsCard+timeline+corr+speed+sessions+docCard+shotsCard+
      '<div class="card"><h2>Competitor comparison</h2>'+comps+'</div>';
  }

  function lightbox(src){var el=document.createElement("div");el.className="lightbox";var i=new Image();i.src=src;el.appendChild(i);el.onclick=function(){el.remove();};document.body.appendChild(el);}
  function wireReport(a,d,m){
    var atv=document.getElementById("atv");
    var rf=document.getElementById("refetch");
    if(rf)rf.onclick=function(){rf.disabled=true;rf.textContent="Fetching...";renderDoc(d.id);};
    app.querySelectorAll(".fl[data-seg]").forEach(function(c){c.onclick=function(){jumpToSeg(c.dataset.seg);};});
    app.querySelectorAll(".fbtn").forEach(function(b){b.onclick=function(){
      app.querySelectorAll(".fbtn").forEach(function(x){x.classList.remove("on");});b.classList.add("on");
      if(!atv)return;if(b.dataset.f==="all")atv.removeAttribute("data-flt");else atv.setAttribute("data-flt",b.dataset.f);
    };});
    app.querySelectorAll(".shot .ph").forEach(function(ph){
      if(ph.dataset.url){var im=new Image();im.src=ph.dataset.url;im.onclick=function(){lightbox(ph.dataset.url);};im.onload=function(){ph.parentNode.replaceChild(im,ph);};return;}
      var path=ph.dataset.path;if(!path){ph.textContent="unavailable";return;}
      sb.storage.from("evidence").createSignedUrl(path,3600).then(function(r){
        if(r.error||!r.data){ph.textContent="unavailable";return;}
        var img=new Image();img.src=r.data.signedUrl;img.onclick=function(){lightbox(r.data.signedUrl);};img.onerror=function(){ph.textContent="unavailable";};img.onload=function(){ph.parentNode.replaceChild(img,ph);};
      }).catch(function(){ph.textContent="unavailable";});
    });
  }
})();

</script>
</body>
</html>
